name: LineageOS 18.1 - BuildBuddy RBE Pinned Reclient Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: los18-star2lte-rbe-real-test
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"

      # The Android 11 reclient 0.25.x does not support RBE_remote_headers.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # Keep all RBE diagnostics in one place.
      RBE_log_dir: "/tmp/rbe-test"
      RBE_log_path: "text:///tmp/rbe-test/reproxy_log.txt"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "2"

      # This workflow is a correctness / connectivity test, not a speed test.
      NINJA_REMOTE_NUM_JOBS: "1"
      NINJA_HIGHMEM_NUM_JOBS: "1"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          mkdir -p /home/runner/work/los /tmp/rbe-test

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los

          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-18.1

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Reclient 0.25 (2021) predates the Remote Execution API fix for
      # working-directory-relative output paths (SDK fix Nov 2021).
      # Pin a coherent prebuilt release rather than mixing rewrapper/reproxy.
      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          ORIGINAL="prebuilts/remoteexecution-client/live"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Use binaries from the SAME prebuilt release. The original
          # dependency-scanner files are retained only if not shipped by it.
          for bin in rewrapper reproxy bootstrap; do
            test -s "$FETCH_DIR/$PINNED_VERSION/$bin"
            install -m 0755 "$FETCH_DIR/$PINNED_VERSION/$bin" "$DEST/$bin"
          done
          for bin in dumpstats scandeps_server; do
            if [ -s "$FETCH_DIR/$PINNED_VERSION/$bin" ]; then
              install -m 0755 "$FETCH_DIR/$PINNED_VERSION/$bin" "$DEST/$bin"
            elif [ -x "$ORIGINAL/$bin" ]; then
              cp -L "$ORIGINAL/$bin" "$DEST/$bin"
              chmod 0755 "$DEST/$bin"
            fi
          done
          for lib in dependency_scanner_go_plugin.so; do
            if [ -f "$FETCH_DIR/$PINNED_VERSION/$lib" ]; then
              cp "$FETCH_DIR/$PINNED_VERSION/$lib" "$DEST/$lib"
            elif [ -f "$ORIGINAL/$lib" ]; then
              cp -L "$ORIGINAL/$lib" "$DEST/$lib"
            fi
          done

          printf 'pinned_commit=%s\npinned_version=%s\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

      - name: Inspect Android reclient
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== RECLIENT DIRECTORY ==="
          ls -lah "$RBE_DIR"

          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/bootstrap"

          echo "=== RBE DEPENDENCY SCANNER ==="
          if [ -f "$RBE_DIR/dependency_scanner_go_plugin.so" ]; then
            echo "dependency_scanner_go_plugin.so found."
          else
            echo "::warning::dependency_scanner_go_plugin.so not found in $RBE_DIR."
          fi
          if [ -x "$RBE_DIR/scandeps_server" ]; then
            echo "scandeps_server found."
          else
            echo "::notice::scandeps_server not found (may be absent in older reclient builds)."
          fi

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."

          echo "=== BUILD BUDDY TLS CHAIN DIAGNOSTIC ==="
          TLS_LOG="/tmp/rbe-test/buildbuddy-tls-check.log"
          mkdir -p /tmp/rbe-test
          if ! timeout 20 openssl s_client \
            -connect remote.buildbuddy.io:443 \
            -servername remote.buildbuddy.io \
            -verify_hostname remote.buildbuddy.io \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > "$TLS_LOG" 2>&1; then
            echo "::warning::OpenSSL certificate precheck returned an error; see artifact."
          fi
          grep -E 'Verification:|Verify return code:|verify error:|Verification error:|^subject=|^issuer=' "$TLS_LOG" | tail -30 || true

          echo "Authentication will be validated by the real reclient compile below."

      - name: Start authenticated BuildBuddy gRPC bridge
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # This is needed for Android 11's old reclient which cannot attach
          # custom gRPC metadata. The only cleartext hop is loopback.
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          umask 077

          # Never write the secret into workflow logs, a command argument,
          # or the uploaded /tmp/rbe-test artifact directory.
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path

          secret = os.environ['BUILDBUDDY_API_KEY']
          if not secret or any(ch in secret for ch in ('\n', '\r', '\x00')):
              raise SystemExit('Invalid BuildBuddy API key format')

          # Escape an nginx double-quoted string safely.
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          error_log /tmp/rbe-test/buildbuddy-grpc-errors.log warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_max_body_size 0;
            server {
              listen 127.0.0.1:19099 http2;
              server_name localhost;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                # Android 11 bridge: allow intermediate CAs in the TLS chain.
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_connect_timeout 30s;
                grpc_read_timeout 300s;
                grpc_send_timeout 300s;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE

          nginx -t -c "$BRIDGE_DIR/nginx.conf"
          nginx -c "$BRIDGE_DIR/nginx.conf"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/19099) >/dev/null 2>&1; then
              echo "BuildBuddy local gRPC bridge is listening on 127.0.0.1:19099."
              exit 0
            fi
            sleep 1
          done
          echo "::error::BuildBuddy gRPC bridge failed to start."
          exit 1

      - name: Configure Lineage and run real RBE C++ compile
        working-directory: /home/runner/work/los
        timeout-minutes: 45
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p /tmp/rbe-test

          # LineageOS 18.1 / Android 11 uses PRODUCT-VARIANT format.
          # TARGET_RELEASE and aosp_target_release are for newer build trees.
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh; check repo sync and working-directory."
            exit 1
          fi
          source build/envsetup.sh
          lunch lineage_star2lte-userdebug

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"

          if [ -z "${ANDROID_BUILD_TOP:-}" ] || \
             [ "${TARGET_PRODUCT:-}" != "lineage_star2lte" ] || \
             [ "${TARGET_BUILD_VARIANT:-}" != "userdebug" ]; then
            echo "::error::Invalid LineageOS build configuration."
            exit 1
          fi

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          # Keep working_directory non-empty ("los") for BuildBuddy, while
          # upgraded reclient handles output_files relative to that directory.
          export RBE_exec_root="$(dirname "$(pwd -P)")"
          RBE_REL_WORKDIR="$(realpath --relative-to="$RBE_exec_root" "$(pwd -P)")"

          echo "=== RBE WORKING DIRECTORY COMPATIBILITY ==="
          echo "RBE_exec_root=$RBE_exec_root"
          echo "RBE_REL_WORKDIR=$RBE_REL_WORKDIR"
          if [ "$RBE_REL_WORKDIR" != "los" ]; then
            echo "::error::Unexpected RBE working directory: $RBE_REL_WORKDIR"
            exit 1
          fi
          if [ ! -d "$RBE_exec_root/$RBE_REL_WORKDIR/bionic" ]; then
            echo "::error::Android source tree is missing under RBE_exec_root."
            exit 1
          fi
          printf 'RBE_exec_root=%s\nRBE_relative_working_dir=%s\n' \
            "$RBE_exec_root" "$RBE_REL_WORKDIR" \
            > /tmp/rbe-test/rbe-working-directory.txt

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_service_no_security=${RBE_service_no_security}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_exec_root=${RBE_exec_root}"
            echo "RBE_relative_working_dir=${RBE_REL_WORKDIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "BuildBuddy auth=loopback nginx gRPC bridge (TLS upstream)"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_log_path=${RBE_log_path}"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_v=${RBE_v}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
          } | tee /tmp/rbe-test/rbe-env.txt

          echo "=== GENERATE BUILD GRAPH ==="
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          echo "=== VERIFY REWRAPPER IS PRESENT IN GENERATED GRAPH ==="
          : > /tmp/rbe-test/rewrapper-ninja-matches.txt
          FOUND_REWRAPPER=0

          for ninja_file in \
            "$ANDROID_BUILD_TOP/out/soong/build.ninja" \
            "$BUILD_NINJA"; do
            if [ -s "$ninja_file" ]; then
              if grep -n -m 20 -E 'remoteexecution-client/.*/rewrapper|(^|[ /])rewrapper([ "]|$)' \
                "$ninja_file" \
                | tee -a /tmp/rbe-test/rewrapper-ninja-matches.txt; then
                FOUND_REWRAPPER=1
              fi
            fi
          done

          if [ "$FOUND_REWRAPPER" -ne 1 ]; then
            echo "::error::RBE is enabled, but no rewrapper command was found in the generated Ninja graph."
            echo "This means the C/C++ actions are not actually being routed through reclient."
            exit 1
          fi

          # Reclient 0.57+ understands working-directory-relative outputs.
          # No rewrapper output-directory shim is installed: the Remote
          # Execution API requires output paths relative to working_directory.
          echo "=== PINNED RECLIENT OUTPUT PATH CHECK ==="
          cat /tmp/rbe-test/reclient-version.txt
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"

          echo "=== REAL C++ BUILD: libbase ==="
          echo "This is intentionally a clean source-output build without restored ccache."
          echo "RBE_CXX_EXEC_STRATEGY=remote makes a remote failure fatal instead of silently falling back locally."

          # Capture failure without losing the real build status to tee/pipefail.
          set +e
          m -j1 libbase 2>&1 | tee /tmp/rbe-test/real-cxx-compile.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "=== RBE COMPILE FAILED (exit $BUILD_RC) ==="

            echo "=== REPROXY LOG TAIL ==="
            if [ -s /tmp/rbe-test/reproxy_log.txt ]; then
              tail -n 150 /tmp/rbe-test/reproxy_log.txt
            else
              echo "::warning::reproxy_log.txt missing or empty; listing available diagnostics."
            fi

            echo "=== REMOTE ACTION WORKING DIR / OUTPUT MAPPINGS ==="
            find /tmp/rbe-test -maxdepth 1 -name '*.rpl' -size +0c -print \
              -exec grep -aE 'working_directory:|output_files:|status: ' {} \; \
              | tail -n 80 || true

            echo "=== RECLIENT DIAGNOSTIC FILES ==="
            find /tmp/rbe-test -maxdepth 3 -type f \
              -printf '%p %s bytes\n' | sort

            echo "=== RECLIENT ERROR SCAN ==="
            grep -aRinE \
              'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
              /tmp/rbe-test \
              --exclude=real-cxx-compile.log \
              --exclude=m-nothing.log \
              2>/dev/null | head -100 || true

            echo "::error::Remote-only C++ compilation failed; inspect the RBE diagnostics artifact."
            exit "$BUILD_RC"
          fi

          echo "=== VERIFY REMOTE OBJECT WAS RETURNED ==="
          CRT_OBJ="$ANDROID_BUILD_TOP/out/soong/.intermediates/bionic/libc/crtbegin_so1/android_arm64_armv8-a_cortex-a53/obj/bionic/libc/arch-common/bionic/crtbegin_so.o"
          if [ ! -s "$CRT_OBJ" ]; then
            echo "::error::Remote compile completed but local crtbegin_so.o is missing: $CRT_OBJ"
            exit 1
          fi
          ls -lh "$CRT_OBJ"

          echo "=== RBE OUTPUT FILES ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | tee /tmp/rbe-test/rbe-files.txt

          echo "=== RBE METRICS ==="
          if [ -s /tmp/rbe-test/rbe_metrics.txt ]; then
            cat /tmp/rbe-test/rbe_metrics.txt
          else
            echo "::warning::rbe_metrics.txt was not produced by this reclient version."
          fi

          echo "=== RBE ERROR SCAN ==="
          grep -R -n -E \
            'Unauthenticated|PermissionDenied|PERMISSION_DENIED|UNAUTHENTICATED|credential|authentication|FAILED|FATAL|ERROR' \
            /tmp/rbe-test \
            --exclude='real-cxx-compile.log' \
            --exclude='m-nothing.log' \
            2>/dev/null | head -200 || true

          echo "=== RBE TEST PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          echo "Real C++ module build completed with RBE_CXX_EXEC_STRATEGY=remote."

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true

          echo "=== REPROXY LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/reproxy_log.txt 2>/dev/null || true

          echo "=== ALL AVAILABLE RECLIENT LOGS ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            \( -iname '*log*' -o -name '*.rpl' -o -iname '*metrics*' \) \
            -printf '%p %s bytes\n' | sort || true

          echo "=== RBE ERROR SUMMARY ==="
          grep -aRinE \
            'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
            /tmp/rbe-test \
            --exclude=real-cxx-compile.log \
            --exclude=m-nothing.log \
            2>/dev/null | head -100 || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== REAL C++ BUILD LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/real-cxx-compile.log 2>/dev/null || true

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Redact BuildBuddy API key from RBE artifacts
        if: always()
        shell: bash
        run: |
          set -e
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path

          key = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          root = Path("/tmp/rbe-test")
          if key and root.is_dir():
              for file in root.rglob("*"):
                  if not file.is_file() or file.is_symlink():
                      continue
                  data = file.read_bytes()
                  if key in data:
                      # Preserve file length for binary diagnostic formats.
                      file.write_bytes(data.replace(key, b"*" * len(key)))
                      print(f"Redacted secret from: {file.relative_to(root)}")
          PYREDACT

      - name: Upload RBE test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7
